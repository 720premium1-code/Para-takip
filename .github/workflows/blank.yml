
name: Build Para Takip APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Android projesini ZIP'ten çıkar
        run: |
          unzip -o para-takip-android-proje.zip -d project

      - name: APK oluştur
        run: |
          find project -name gradlew -type f
          cd project/ParaTakipAndroid
          gradle assembleDebug

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: para-takip-apk
          path: project/ParaTakipAndroid/app/build/outputs/apk/debug/app-debug.apk
